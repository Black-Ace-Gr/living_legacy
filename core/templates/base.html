{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Grace — A Life That Became Home."
    >

    <title>
        {% block title %}
        Grace | A Life That Became Home
        {% endblock %}
    </title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <!-- Base styles -->
    <link
        rel="stylesheet"
        href="{% static 'css/base.css' %}"
    >

    {% block extra_css %}
    {% endblock %}
</head>

<body>

    {% block content %}
    {% endblock %}


    {% block scripts %}
    {% endblock %}

</body>

</html>
